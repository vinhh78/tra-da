<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trà Đá Hà Nội - Bản Đồ Cộng Đồng</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        .liquid-glass {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.04));
            backdrop-filter: blur(40px) saturate(220%);
            -webkit-backdrop-filter: blur(40px) saturate(220%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.6), 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .liquid-glass-pill {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.03));
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.6), 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .nav-item {
            position: relative;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .nav-item.active {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0.12));
            box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.8), 0 4px 15px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.45);
            color: #ffffff;
            font-weight: 500;
        }

        .liquid-glass-card {
            background: linear-gradient(135deg, rgba(40, 40, 40, 0.5), rgba(20, 20, 20, 0.3));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.3s ease;
        }
        .liquid-glass-card:hover {
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }

        .filter-dark-map {
            filter: brightness(0.8) invert(1) contrast(1.2) hue-rotate(200deg) saturate(0.3) brightness(0.7);
        }

        .leaflet-popup-content-wrapper {
            background: rgba(20, 20, 20, 0.85) !important;
            backdrop-filter: blur(25px);
            color: white !important;
            border: 1px solid rgba(255, 255, 255, 0.25) !important;
            border-radius: 20px !important;
        }
        .leaflet-popup-tip { background: rgba(20, 20, 20, 0.85) !important; }

        .modal-hidden { opacity: 0; pointer-events: none; transform: scale(0.95); visibility: hidden; }
        .modal-visible { opacity: 1; pointer-events: auto; transform: scale(1); visibility: visible; }
    </style>
</head>
<body class="bg-[#050507] text-white font-sans h-screen flex flex-col overflow-hidden">
    
    <!-- Header chuẩn Mobile & Desktop -->
    <header class="w-full liquid-glass flex-none z-50 px-3 md:px-6 py-2.5 flex flex-col md:flex-row items-center justify-between gap-2 border-b border-white/10">
        <div class="w-full md:w-auto flex items-center justify-between">
            <div class="font-bold text-base md:text-lg tracking-widest uppercase flex flex-col items-center leading-none">
                <span class="text-red-500 text-[10px]">Trà Đá</span>
                <span class="text-white text-sm md:text-base">Hà Nội</span>
            </div>
            <button onclick="openModalQuick()" class="liquid-glass-pill hover:bg-white/30 text-white text-xs px-3.5 py-1.5 rounded-full font-medium transition flex items-center gap-1 text-yellow-300 shadow-lg md:hidden">
                <span>+</span> Thêm quán
            </button>
        </div>

        <!-- Menu điều hướng giọt nước (Hiển thị hoàn hảo trên cả điện thoại) -->
        <nav id="main-nav" class="flex items-center gap-1 liquid-glass-pill px-2 py-1 rounded-full text-xs font-light text-gray-300 overflow-x-auto custom-scrollbar w-full md:w-auto justify-start md:justify-center">
            <a href="#" data-target="screen-map" class="nav-item px-3 py-1.5 rounded-full active whitespace-nowrap text-center">Bản đồ</a>
            <a href="#" data-target="screen-category" class="nav-item px-3 py-1.5 rounded-full hover:text-white transition whitespace-nowrap text-center">Phân loại</a>
            <a href="#" data-target="screen-new" class="nav-item px-3 py-1.5 rounded-full hover:text-white transition whitespace-nowrap text-center">Mới</a>
            <a href="#" data-target="screen-highlight" class="nav-item px-3 py-1.5 rounded-full hover:text-white transition whitespace-nowrap text-center">Tiêu điểm</a>
        </nav>
        
        <div class="hidden md:flex items-center gap-3">
            <button onclick="openModalQuick()" class="liquid-glass-pill hover:bg-white/25 text-white text-xs px-4 py-2 rounded-full font-medium transition flex items-center gap-1.5 text-yellow-300 shadow-lg">
                <span>+</span> Thêm quán
            </button>
        </div>
    </header>

    <div id="app-screens" class="flex-1 w-full overflow-hidden relative flex flex-col lg:flex-row">
        
        <!-- Màn hình bản đồ -->
        <div id="screen-map" class="screen-view flex flex-col lg:flex-row h-full w-full absolute inset-0 z-10">
            <div id="map" class="absolute inset-0 w-full h-full z-0 filter-dark-map"></div>

            <div class="w-full lg:w-[420px] flex flex-col h-[40%] lg:h-[calc(100%-2rem)] lg:m-4 liquid-glass lg:rounded-3xl border border-white/20 z-20 order-2 lg:order-1 shadow-2xl overflow-hidden">
                <div class="p-3 md:p-5 flex-none border-b border-white/10 bg-white/5 backdrop-blur-md">
                    <h2 class="text-base md:text-xl font-medium tracking-wide">Danh sách quán</h2>
                </div>
                <div id="shop-list" class="flex-1 overflow-y-auto grid grid-cols-1 gap-2.5 p-2.5 md:p-4 custom-scrollbar"></div>
            </div>
        </div>

        <!-- Màn hình phân loại -->
        <div id="screen-category" class="screen-view hidden h-full w-full p-6 md:p-10 overflow-y-auto custom-scrollbar absolute inset-0 bg-[#050507] z-20">
            <h2 class="text-2xl md:text-3xl font-light tracking-wide mb-6">Các Dòng Quán</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                <div class="h-48 liquid-glass-card rounded-2xl p-6 flex flex-col justify-end cursor-pointer">
                    <span class="text-2xl mb-2">🍵</span>
                    <h3 class="text-lg font-medium">Trà đá vỉa hè</h3>
                </div>
                <div class="h-48 liquid-glass-card rounded-2xl p-6 flex flex-col justify-end cursor-pointer">
                    <span class="text-2xl mb-2">🍋</span>
                    <h3 class="text-lg font-medium">Trà chanh</h3>
                </div>
                <div class="h-48 liquid-glass-card rounded-2xl p-6 flex flex-col justify-end cursor-pointer">
                    <span class="text-2xl mb-2">☕</span>
                    <h3 class="text-lg font-medium">Cafe vỉa hè</h3>
                </div>
            </div>
        </div>

        <!-- Màn hình mới -->
        <div id="screen-new" class="screen-view hidden h-full w-full p-6 md:p-10 overflow-y-auto custom-scrollbar absolute inset-0 bg-[#050507] z-20">
            <h2 class="text-2xl md:text-3xl font-light tracking-wide mb-6">Quán Mới Cập Nhật</h2>
        </div>

        <!-- Màn hình tiêu điểm -->
        <div id="screen-highlight" class="screen-view hidden h-full w-full p-6 md:p-10 overflow-y-auto custom-scrollbar absolute inset-0 bg-[#050507] z-20">
            <h2 class="text-2xl md:text-3xl font-light tracking-wide mb-6">Tiêu Điểm</h2>
        </div>
    </div>

    <!-- Modal Thêm Quán -->
    <div id="add-modal" class="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black/70 backdrop-blur-2xl transition-all duration-300 modal-hidden">
        <div class="liquid-glass border border-white/30 p-6 md:p-8 w-full max-w-md relative transition-transform duration-300 rounded-3xl shadow-2xl">
            <button onclick="closeModal()" class="absolute top-5 right-5 text-gray-400 hover:text-white bg-white/10 w-8 h-8 rounded-full flex items-center justify-center">✕</button>

            <h2 class="text-xl font-light tracking-wider text-white mb-6 border-b border-white/15 pb-3">
                Thêm Quán Trà Đá
            </h2>

            <form id="add-shop-form" class="space-y-4 text-sm font-light">
                <div class="border-2 border-dashed border-white/25 hover:border-white/50 p-4 text-center cursor-pointer transition relative rounded-2xl bg-black/40">
                    <input type="file" id="shop-image" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                    <div id="image-preview-container" class="flex flex-col items-center justify-center pointer-events-none">
                        <span class="text-2xl mb-1">📸</span>
                        <span class="text-gray-300 text-xs">Tải ảnh lên</span>
                    </div>
                </div>

                <div>
                    <input id="shop-name" required type="text" class="w-full px-4 py-2.5 rounded-xl bg-black/60 border border-white/20 focus:border-yellow-400 focus:outline-none transition text-white text-sm" placeholder="Tên quán">
                </div>
                <div>
                    <input id="shop-address" required type="text" class="w-full px-4 py-2.5 rounded-xl bg-black/60 border border-white/20 focus:border-yellow-400 focus:outline-none transition text-white text-sm" placeholder="Địa chỉ">
                </div>
                <div>
                    <input id="shop-price" required type="text" class="w-full px-4 py-2.5 rounded-xl bg-black/60 border border-white/20 focus:border-yellow-400 focus:outline-none transition text-white text-sm" placeholder="Mức giá (VD: 10K)">
                </div>

                <div class="pt-3">
                    <button type="submit" class="w-full liquid-glass-pill text-white font-semibold tracking-wide py-3 rounded-xl hover:bg-white/30 transition-all uppercase text-xs shadow-lg">
                        Xác nhận lưu
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentLatLng = { lat: 21.0285, lng: 105.8541 };
        let mapMarkersLayer = null;
        let uploadedImageBase64 = ''; 

        const defaultImage = "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?q=80&w=600&auto=format&fit=crop";

        let shops = JSON.parse(localStorage.getItem('trada_hanoi_shops_v6'));
        if (!shops || shops.length === 0) {
            shops = [
                { id: 1, name: "Trà Đá Nhà Thờ Lớn", address: "Hoàn Kiếm", lat: 21.0287, lng: 105.8488, price: "15K", image: "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=600" }
            ];
            localStorage.setItem('trada_hanoi_shops_v6', JSON.stringify(shops));
        }

        const map = L.map('map', { zoomControl: false }).setView([21.0285, 105.8541], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        mapMarkersLayer = L.layerGroup().addTo(map);

        const teaIcon = L.divIcon({
            html: `<div style="font-size: 24px; filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8));">📍</div>`,
            className: 'bg-transparent border-none',
            iconSize: [24, 24],
            iconAnchor: [12, 12]
        });

        function renderApp() {
            const listContainer = document.getElementById('shop-list');
            listContainer.innerHTML = '';
            mapMarkersLayer.clearLayers();

            shops.forEach(shop => {
                const shopCard = document.createElement('div');
                shopCard.className = "liquid-glass-card rounded-2xl overflow-hidden cursor-pointer flex gap-3 p-3 items-center group relative";
                shopCard.innerHTML = `
                    <img src="${shop.image || defaultImage}" class="w-14 h-14 rounded-xl object-cover flex-none group-hover:scale-105 transition duration-500" alt="Shop">
                    <div class="flex-1 min-w-0">
                        <h3 class="text-sm font-medium text-white truncate">${shop.name}</h3>
                        <p class="text-xs text-gray-400 mt-0.5 truncate">${shop.address}</p>
                        <span class="inline-block mt-1 text-[11px] font-medium text-yellow-300 bg-yellow-500/10 px-2 py-0.5 rounded-full border border-yellow-500/20">${shop.price}</span>
                    </div>
                    <button onclick="deleteShop(${shop.id}, event)" class="absolute top-2 right-2 text-gray-500 hover:text-red-400 text-xs px-2 py-1 opacity-0 group-hover:opacity-100 transition-opacity">✕</button>
                `;
                shopCard.onclick = () => {
                    map.flyTo([shop.lat, shop.lng], 16, { duration: 1 });
                    if(window.innerWidth < 1024) {
                        document.getElementById('screen-map').scrollIntoView({behavior: 'smooth'});
                    }
                };
                listContainer.appendChild(shopCard);

                L.marker([shop.lat, shop.lng], { icon: teaIcon })
                    .bindPopup(`
                        <div class="font-sans font-light tracking-wide w-44 p-1">
                            <img src="${shop.image || defaultImage}" class="w-full h-24 object-cover mb-2 rounded-xl border border-white/20">
                            <span class="text-white font-medium">${shop.name}</span>
                            <p class="text-xs text-gray-300 mt-1">${shop.address}</p>
                            <span class="inline-block mt-2 text-xs text-yellow-300 font-semibold">${shop.price}</span>
                        </div>
                    `)
                    .addTo(mapMarkersLayer);
            });
        }

        function switchScreen(targetId) {
            const screenViews = document.querySelectorAll('.screen-view');
            const navItems = document.querySelectorAll('.nav-item');

            screenViews.forEach(screen => {
                screen.classList.add('hidden');
                screen.classList.remove('flex', 'block', 'z-10');
            });

            const targetScreen = document.getElementById(targetId);
            if (targetId === 'screen-map') {
                targetScreen.classList.remove('hidden');
                targetScreen.classList.add('flex', 'z-10');
                setTimeout(() => { map.invalidateSize(); }, 100);
            } else {
                targetScreen.classList.remove('hidden');
                targetScreen.classList.add('block', 'z-10');
            }

            navItems.forEach(nav => {
                if(nav.getAttribute('data-target') === targetId) {
                    nav.classList.add('active');
                } else {
                    nav.classList.remove('active');
                }
            });
        }

        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                switchScreen(this.getAttribute('data-target'));
            });
        });

        document.getElementById('shop-image').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    uploadedImageBase64 = event.target.result;
                    document.getElementById('image-preview-container').innerHTML = `<img src="${uploadedImageBase64}" class="w-full h-28 object-cover rounded-xl border border-white/20">`;
                };
                reader.readAsDataURL(file); 
            }
        });

        const modal = document.getElementById('add-modal');
        const form = document.getElementById('add-shop-form');

        map.on('click', function(e) {
            currentLatLng = e.latlng;
            openModal();
        });

        function openModalQuick() {
            currentLatLng = map.getCenter();
            openModal();
        }

        function openModal() {
            modal.classList.remove('modal-hidden');
            modal.classList.add('modal-visible');
            document.getElementById('shop-name').focus();
            uploadedImageBase64 = '';
            document.getElementById('image-preview-container').innerHTML = `
                <span class="text-2xl mb-1">📸</span>
                <span class="text-gray-300 text-xs">Tải ảnh lên</span>
            `;
        }

        function closeModal() {
            modal.classList.remove('modal-visible');
            modal.classList.add('modal-hidden');
            form.reset();
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const newShop = {
                id: Date.now(),
                name: document.getElementById('shop-name').value,
                address: document.getElementById('shop-address').value,
                price: document.getElementById('shop-price').value,
                lat: currentLatLng.lat,
                lng: currentLatLng.lng,
                image: uploadedImageBase64 || defaultImage
            };

            shops.unshift(newShop);
            try {
                localStorage.setItem('trada_hanoi_shops_v6', JSON.stringify(shops));
            } catch (err) {
                alert("Dung lượng ảnh quá lớn!");
                shops.shift(); 
                return;
            }
            
            closeModal();
            renderApp();
            switchScreen('screen-map');
            map.flyTo([newShop.lat, newShop.lng], 16, { duration: 1.5 });
        });

        window.deleteShop = function(id, event) {
            event.stopPropagation();
            if(confirm("Xóa quán này?")) {
                shops = shops.filter(s => s.id !== id);
                localStorage.setItem('trada_hanoi_shops_v6', JSON.stringify(shops));
                renderApp();
            }
        }

        renderApp();
    </script>
</body>
</html>
