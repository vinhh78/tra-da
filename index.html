<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trà Đá Hà Nội - Bản Đồ Cộng Đồng</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        .liquid-glass {
            background: rgba(20, 20, 20, 0.65);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .liquid-glass-card {
            background: rgba(30, 30, 30, 0.5);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .liquid-glass-card:hover {
            background: rgba(45, 45, 45, 0.7);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }

        .filter-dark-map {
            filter: brightness(0.8) invert(1) contrast(1.2) hue-rotate(200deg) saturate(0.3) brightness(0.7);
        }

        .leaflet-popup-content-wrapper {
            background: rgba(20, 20, 20, 0.9) !important;
            backdrop-filter: blur(10px);
            color: white !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            border-radius: 16px !important;
        }
        .leaflet-popup-tip { background: rgba(20, 20, 20, 0.9) !important; }

        .modal-hidden { opacity: 0; pointer-events: none; transform: scale(0.95); visibility: hidden; }
        .modal-visible { opacity: 1; pointer-events: auto; transform: scale(1); visibility: visible; }
    </style>
</head>
<body class="bg-[#0b0b0c] text-white font-sans h-screen flex flex-col overflow-hidden">
    
    <header class="w-full liquid-glass flex-none z-50 px-4 md:px-6 h-16 flex items-center justify-between border-b border-white/10">
        <div class="flex items-center gap-4">
            <div class="font-bold text-lg tracking-widest uppercase flex flex-col items-center leading-none">
                <span class="text-red-500 text-xs">Trà Đá</span>
                <span class="text-white text-base">Hà Nội</span>
            </div>
            <nav id="main-nav" class="hidden md:flex items-center gap-6 text-sm font-light text-gray-300">
                <a href="#" data-target="screen-category" class="nav-item hover:text-white transition">Các dòng quán</a>
                <a href="#" data-target="screen-new" class="nav-item hover:text-white transition">Quán mới</a>
                <a href="#" data-target="screen-map" class="nav-item text-white border-b border-red-500 pb-1 z-10 font-medium">Bản đồ</a>
                <a href="#" data-target="screen-highlight" class="nav-item hover:text-white transition">Tiêu điểm</a>
            </nav>
        </div>
        
        <div class="flex items-center gap-3">
            <div class="hidden sm:flex items-center gap-2 bg-black/40 px-3 py-1.5 rounded-full border border-white/10">
                <span class="text-gray-400 text-xs">🔍</span>
                <input type="text" placeholder="Tìm kiếm..." class="bg-transparent border-none focus:outline-none text-xs text-white placeholder-gray-500 w-28">
            </div>
            <button onclick="openModalQuick()" class="bg-red-600 hover:bg-red-700 text-white text-xs px-3.5 py-2 rounded-full font-medium transition shadow-lg shadow-red-600/30 flex items-center gap-1">
                <span>+</span> Thêm quán
            </button>
        </div>
    </header>

    <div id="app-screens" class="flex-1 w-full overflow-hidden relative">
        <div id="screen-map" class="screen-view flex flex-col lg:flex-row h-full w-full absolute inset-0 z-10 bg-[#0b0b0c]">
            <div class="w-full lg:w-[420px] flex flex-col h-1/2 lg:h-full liquid-glass border-r border-white/10 z-20 order-2 lg:order-1">
                <div class="p-4 md:p-6 flex-none border-b border-white/5">
                    <h2 class="text-xl md:text-2xl font-light tracking-wide">Danh sách quán</h2>
                </div>
                <div id="shop-list" class="flex-1 overflow-y-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-1 gap-3 p-3 md:p-4 custom-scrollbar"></div>
            </div>
            <div class="w-full lg:flex-1 h-1/2 lg:h-full relative order-1 lg:order-2">
                <div id="map" class="w-full h-full z-10 filter-dark-map"></div>
            </div>
        </div>

        <div id="screen-category" class="screen-view hidden h-full w-full p-6 md:p-10 overflow-y-auto custom-scrollbar absolute inset-0 bg-[#0b0b0c]">
            <h2 class="text-2xl md:text-3xl font-light tracking-wide mb-6">Các Dòng Quán</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                <div class="h-48 liquid-glass-card rounded-2xl p-6 flex flex-col justify-end cursor-pointer">
                    <span class="text-2xl mb-2">🍵</span>
                    <h3 class="text-lg font-medium">Trà đá vỉa hè</h3>
                </div>
                <div class="h-48 liquid-glass-card rounded-2xl p-6 flex flex-col justify-end cursor-pointer">
                    <span class="text-2xl mb-2">🍋</span>
                    <h3 class="text-lg font-medium">Trà chanh</h3>
                </div>
                <div class="h-48 liquid-glass-card rounded-2xl p-6 flex flex-col justify-end cursor-pointer">
                    <span class="text-2xl mb-2">☕</span>
                    <h3 class="text-lg font-medium">Cafe vỉa hè</h3>
                </div>
            </div>
        </div>

        <div id="screen-new" class="screen-view hidden h-full w-full p-6 md:p-10 overflow-y-auto custom-scrollbar absolute inset-0 bg-[#0b0b0c]">
            <h2 class="text-2xl md:text-3xl font-light tracking-wide mb-6">Quán Mới Cập Nhật</h2>
        </div>

        <div id="screen-highlight" class="screen-view hidden h-full w-full p-6 md:p-10 overflow-y-auto custom-scrollbar absolute inset-0 bg-[#0b0b0c]">
            <h2 class="text-2xl md:text-3xl font-light tracking-wide mb-6">Tiêu Điểm</h2>
        </div>
    </div>

    <div class="md:hidden flex-none liquid-glass border-t border-white/10 px-6 py-3 flex justify-around items-center z-50">
        <button onclick="switchScreen('screen-map')" class="text-xs flex flex-col items-center text-red-500 mobile-nav-btn" data-target="screen-map">
            <span class="text-lg">🗺️</span> Bản đồ
        </button>
        <button onclick="switchScreen('screen-category')" class="text-xs flex flex-col items-center text-gray-400 mobile-nav-btn" data-target="screen-category">
            <span class="text-lg">🍵</span> Phân loại
        </button>
        <button onclick="switchScreen('screen-new')" class="text-xs flex flex-col items-center text-gray-400 mobile-nav-btn" data-target="screen-new">
            <span class="text-lg">✨</span> Mới
        </button>
        <button onclick="switchScreen('screen-highlight')" class="text-xs flex flex-col items-center text-gray-400 mobile-nav-btn" data-target="screen-highlight">
            <span class="text-lg">🔥</span> Tiêu điểm
        </button>
    </div>

    <div id="add-modal" class="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black/80 backdrop-blur-xl transition-all duration-300 modal-hidden">
        <div class="liquid-glass border border-white/20 p-6 md:p-8 w-full max-w-md relative transition-transform duration-300 rounded-3xl shadow-2xl">
            <button onclick="closeModal()" class="absolute top-5 right-5 text-gray-400 hover:text-white bg-white/10 w-8 h-8 rounded-full flex items-center justify-center">✕</button>

            <h2 class="text-xl font-light tracking-wider text-white mb-6 border-b border-white/10 pb-3">
                Thêm Quán Trà Đá
            </h2>

            <form id="add-shop-form" class="space-y-4 text-sm font-light">
                <div class="border-2 border-dashed border-white/20 hover:border-white/40 p-4 text-center cursor-pointer transition relative rounded-2xl bg-black/20">
                    <input type="file" id="shop-image" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                    <div id="image-preview-container" class="flex flex-col items-center justify-center pointer-events-none">
                        <span class="text-2xl mb-1">📸</span>
                        <span class="text-gray-300 text-xs">Tải ảnh lên</span>
                    </div>
                </div>

                <div>
                    <input id="shop-name" required type="text" class="w-full px-4 py-2.5 rounded-xl bg-black/40 border border-white/10 focus:border-red-500 focus:outline-none transition text-white text-sm" placeholder="Tên quán">
                </div>
                <div>
                    <input id="shop-address" required type="text" class="w-full px-4 py-2.5 rounded-xl bg-black/40 border border-white/10 focus:border-red-500 focus:outline-none transition text-white text-sm" placeholder="Địa chỉ">
                </div>
                <div>
                    <input id="shop-price" required type="text" class="w-full px-4 py-2.5 rounded-xl bg-black/40 border border-white/10 focus:border-red-500 focus:outline-none transition text-white text-sm" placeholder="Mức giá (VD: 10K)">
                </div>

                <div class="pt-3">
                    <button type="submit" class="w-full bg-white text-black font-semibold tracking-wide py-3 rounded-xl hover:bg-gray-200 transition-all uppercase text-xs shadow-lg">
                        Xác nhận
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentLatLng = { lat: 21.0285, lng: 105.8541 };
        let mapMarkersLayer = null;
        let uploadedImageBase64 = ''; 

        const defaultImage = "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?q=80&w=600&auto=format&fit=crop";

        let shops = JSON.parse(localStorage.getItem('trada_hanoi_shops_v3'));
        if (!shops || shops.length === 0) {
            shops = [
                { id: 1, name: "Trà Đá Nhà Thờ Lớn", address: "Hoàn Kiếm", lat: 21.0287, lng: 105.8488, price: "15K", image: "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=600" }
            ];
            localStorage.setItem('trada_hanoi_shops_v3', JSON.stringify(shops));
        }

        const map = L.map('map', { zoomControl: false }).setView([21.0285, 105.8541], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        mapMarkersLayer = L.layerGroup().addTo(map);

        const teaIcon = L.divIcon({
            html: `<div style="font-size: 24px; filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.8));">📍</div>`,
            className: 'bg-transparent border-none',
            iconSize: [24, 24],
            iconAnchor: [12, 12]
        });

        function renderApp() {
            const listContainer = document.getElementById('shop-list');
            listContainer.innerHTML = '';
            mapMarkersLayer.clearLayers();

            shops.forEach(shop => {
                const shopCard = document.createElement('div');
                shopCard.className = "liquid-glass-card rounded-2xl overflow-hidden cursor-pointer flex gap-3 p-2.5 items-center group relative";
                shopCard.innerHTML = `
                    <img src="${shop.image || defaultImage}" class="w-20 h-20 rounded-xl object-cover flex-none group-hover:scale-105 transition duration-500" alt="Shop">
                    <div class="flex-1 min-w-0">
                        <h3 class="text-sm font-medium text-white truncate">${shop.name}</h3>
                        <p class="text-xs text-gray-400 mt-0.5 truncate">${shop.address}</p>
                        <span class="inline-block mt-2 text-[11px] font-medium text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/20">${shop.price}</span>
                    </div>
                    <button onclick="deleteShop(${shop.id}, event)" class="absolute top-2 right-2 text-gray-500 hover:text-red-400 text-xs px-2 py-1 opacity-0 group-hover:opacity-100 transition-opacity">✕</button>
                `;
                shopCard.onclick = () => map.flyTo([shop.lat, shop.lng], 16, { duration: 1 });
                listContainer.appendChild(shopCard);

                L.marker([shop.lat, shop.lng], { icon: teaIcon })
                    .bindPopup(`
                        <div class="font-sans font-light tracking-wide w-44 p-1">
                            <img src="${shop.image || defaultImage}" class="w-full h-24 object-cover mb-2 rounded-lg border border-white/10">
                            <span class="text-white font-medium">${shop.name}</span>
                            <p class="text-xs text-gray-300 mt-1">${shop.address}</p>
                            <span class="inline-block mt-2 text-xs text-emerald-400 font-semibold">${shop.price}</span>
                        </div>
                    `)
                    .addTo(mapMarkersLayer);
            });
        }

        function switchScreen(targetId) {
            const screenViews = document.querySelectorAll('.screen-view');
            const navItems = document.querySelectorAll('.nav-item');
            const mobileNavBtns = document.querySelectorAll('.mobile-nav-btn');

            screenViews.forEach(screen => {
                screen.classList.add('hidden');
                screen.classList.remove('flex', 'block', 'z-10');
            });

            const targetScreen = document.getElementById(targetId);
            if (targetId === 'screen-map') {
                targetScreen.classList.remove('hidden');
                targetScreen.classList.add('flex', 'z-10');
                setTimeout(() => { map.invalidateSize(); }, 100);
            } else {
                targetScreen.classList.remove('hidden');
                targetScreen.classList.add('block', 'z-10');
            }

            mobileNavBtns.forEach(btn => {
                if(btn.getAttribute('data-target') === targetId) {
                    btn.classList.remove('text-gray-400');
                    btn.classList.add('text-red-500');
                } else {
                    btn.classList.remove('text-red-500');
                    btn.classList.add('text-gray-400');
                }
            });

            navItems.forEach(nav => {
                if(nav.getAttribute('data-target') === targetId) {
                    nav.classList.add('text-white', 'border-b', 'border-red-500', 'pb-1', 'font-medium');
                    nav.classList.remove('text-gray-300');
                } else {
                    nav.classList.remove('text-white', 'border-b', 'border-red-500', 'pb-1', 'font-medium');
                    nav.classList.add('text-gray-300');
                }
            });
        }

        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                switchScreen(this.getAttribute('data-target'));
            });
        });

        document.getElementById('shop-image').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    uploadedImageBase64 = event.target.result;
                    document.getElementById('image-preview-container').innerHTML = `<img src="${uploadedImageBase64}" class="w-full h-28 object-cover rounded-xl border border-white/20">`;
                };
                reader.readAsDataURL(file); 
            }
        });

        const modal = document.getElementById('add-modal');
        const form = document.getElementById('add-shop-form');

        map.on('click', function(e) {
            currentLatLng = e.latlng;
            openModal();
        });

        function openModalQuick() {
            currentLatLng = map.getCenter();
            openModal();
        }

        function openModal() {
            modal.classList.remove('modal-hidden');
            modal.classList.add('modal-visible');
            document.getElementById('shop-name').focus();
            uploadedImageBase64 = '';
            document.getElementById('image-preview-container').innerHTML = `
                <span class="text-2xl mb-1">📸</span>
                <span class="text-gray-300 text-xs">Tải ảnh lên</span>
            `;
        }

        function closeModal() {
            modal.classList.remove('modal-visible');
            modal.classList.add('modal-hidden');
            form.reset();
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const newShop = {
                id: Date.now(),
                name: document.getElementById('shop-name').value,
                address: document.getElementById('shop-address').value,
                price: document.getElementById('shop-price').value,
                lat: currentLatLng.lat,
                lng: currentLatLng.lng,
                image: uploadedImageBase64 || defaultImage
            };

            shops.unshift(newShop);
            try {
                localStorage.setItem('trada_hanoi_shops_v3', JSON.stringify(shops));
            } catch (err) {
                alert("Dung lượng ảnh quá lớn!");
                shops.shift(); 
                return;
            }
            
            closeModal();
            renderApp();
            switchScreen('screen-map');
            map.flyTo([newShop.lat, newShop.lng], 16, { duration: 1.5 });
        });

        window.deleteShop = function(id, event) {
            event.stopPropagation();
            if(confirm("Xóa quán này?")) {
                shops = shops.filter(s => s.id !== id);
                localStorage.setItem('trada_hanoi_shops_v3', JSON.stringify(shops));
                renderApp();
            }
        }

        renderApp();
    </script>
</body>
</html>
