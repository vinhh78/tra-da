<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trà Đá Hà Nội - Bản Đồ Cộng Đồng</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .liquid-glass {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.03));
            backdrop-filter: blur(35px) saturate(200%);
            -webkit-backdrop-filter: blur(35px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.22);
            box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.4), 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .liquid-glass-pill {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.04));
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.5), 0 6px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }
        .liquid-glass-pill:active { transform: scale(0.96); }

        .nav-item {
            position: relative;
            transition: all 0.3s ease;
        }
        .nav-item.active {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0.12));
            box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.8), 0 4px 12px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.45);
            color: #ffffff;
            font-weight: 500;
        }

        .liquid-glass-card {
            background: linear-gradient(135deg, rgba(35, 35, 35, 0.6), rgba(15, 15, 15, 0.4));
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .liquid-glass-card:hover {
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        /* Tối ưu hóa thanh cuộn mượt cho di động */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 10px; }

        .filter-dark-map {
            filter: brightness(0.8) invert(1) contrast(1.2) hue-rotate(200deg) saturate(0.3) brightness(0.7);
        }

        .leaflet-popup-content-wrapper {
            background: rgba(20, 20, 20, 0.9) !important;
            backdrop-filter: blur(20px);
            color: white !important;
            border: 1px solid rgba(255, 255, 255, 0.25) !important;
            border-radius: 16px !important;
        }
        .leaflet-popup-tip { background: rgba(20, 20, 20, 0.9) !important; }

        .modal-hidden { opacity: 0; pointer-events: none; transform: scale(0.95); visibility: hidden; transition: all 0.3s ease; }
        .modal-visible { opacity: 1; pointer-events: auto; transform: scale(1); visibility: visible; transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-[#030305] text-white font-sans h-[100dvh] flex flex-col overflow-hidden">
    
    <!-- Header -->
    <header class="w-full liquid-glass flex-none z-50 px-3.5 md:px-6 py-2.5 flex items-center justify-between border-b border-white/10 gap-2 animate-fade-in">
        <div class="font-bold tracking-widest uppercase flex items-center gap-2 flex-none">
            <span class="text-red-500 text-xs animate-pulse">●</span>
            <span class="text-white text-xs md:text-base font-light tracking-wider">TRÀ ĐÁ <b class="font-bold">HÀ NỘI</b></span>
        </div>

        <nav id="main-nav" class="flex items-center gap-1 liquid-glass-pill px-1.5 py-0.5 rounded-full text-xs font-light text-gray-300 overflow-x-auto custom-scrollbar max-w-[45vw] md:max-w-none">
            <a href="#" data-target="screen-map" class="nav-item px-2.5 py-1 rounded-full active whitespace-nowrap text-center">Bản đồ</a>
            <a href="#" data-target="screen-category" class="nav-item px-2.5 py-1 rounded-full hover:text-white transition whitespace-nowrap text-center">Phân loại</a>
            <a href="#" data-target="screen-new" class="nav-item px-2.5 py-1 rounded-full hover:text-white transition whitespace-nowrap text-center">Mới</a>
            <a href="#" data-target="screen-highlight" class="nav-item px-2.5 py-1 rounded-full hover:text-white transition whitespace-nowrap text-center">Tiêu điểm</a>
        </nav>
        
        <div class="flex items-center flex-none">
            <button onclick="openModalQuick()" class="liquid-glass-pill hover:bg-white/30 text-white text-xs px-3 py-1.5 rounded-full font-medium transition flex items-center gap-1 text-yellow-300 shadow-lg whitespace-nowrap">
                <span class="text-sm font-bold">+</span> <span class="hidden sm:inline">Thêm quán</span>
            </button>
        </div>
    </header>

    <!-- Main Screens Container -->
    <div id="app-screens" class="flex-1 w-full overflow-hidden relative flex flex-col lg:flex-row">
        
        <!-- Màn hình bản đồ -->
        <div id="screen-map" class="screen-view flex flex-col lg:flex-row h-full w-full absolute inset-0 z-10 animate-fade-in">
            <!-- Bản đồ phủ kín nền -->
            <div id="map" class="absolute inset-0 w-full h-full z-0 filter-dark-map"></div>

            <!-- Khung danh sách quán dạng Flexbox chuẩn di động, có thể cuộn mượt mà -->
            <div class="w-full lg:w-[420px] flex flex-col h-[38%] lg:h-[calc(100%-2rem)] lg:m-4 liquid-glass lg:rounded-3xl border border-white/20 z-25 order-2 lg:order-1 shadow-2xl overflow-hidden mt-auto lg:mt-0 backdrop-blur-2xl">
                <div class="p-2.5 md:p-4 flex-none border-b border-white/10 bg-white/5 flex items-center justify-between">
                    <h2 class="text-[11px] md:text-sm uppercase tracking-widest text-gray-300 font-medium">Danh sách quán gần đây</h2>
                    <span class="text-[9px] bg-red-500/20 text-red-400 px-2 py-0.5 rounded-full border border-red-500/30 animate-pulse">Live</span>
                </div>
                <!-- Vùng chứa danh sách cuộn dọc -->
                <div id="shop-list" class="flex-1 overflow-y-auto overscroll-contain grid grid-cols-1 gap-2 p-2.5 custom-scrollbar"></div>
            </div>
        </div>

        <!-- Màn hình phân loại -->
        <div id="screen-category" class="screen-view hidden h-full w-full p-6 md:p-10 overflow-y-auto custom-scrollbar absolute inset-0 bg-[#030305] z-20 animate-fade-in">
            <h2 class="text-2xl md:text-3xl font-light tracking-wide mb-6">Các Dòng Quán</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                <div class="h-48 liquid-glass-card rounded-2xl p-6 flex flex-col justify-end cursor-pointer">
                    <span class="text-3xl mb-2">🍵</span>
                    <h3 class="text-lg font-medium">Trà đá vỉa hè</h3>
                </div>
                <div class="h-48 liquid-glass-card rounded-2xl p-6 flex flex-col justify-end cursor-pointer">
                    <span class="text-3xl mb-2">🍋</span>
                    <h3 class="text-lg font-medium">Trà chanh chém gió</h3>
                </div>
                <div class="h-48 liquid-glass-card rounded-2xl p-6 flex flex-col justify-end cursor-pointer">
                    <span class="text-3xl mb-2">☕</span>
                    <h3 class="text-lg font-medium">Cafe vỉa hè</h3>
                </div>
            </div>
        </div>

        <!-- Màn hình mới -->
        <div id="screen-new" class="screen-view hidden h-full w-full p-6 md:p-10 overflow-y-auto custom-scrollbar absolute inset-0 bg-[#030305] z-20 animate-fade-in">
            <h2 class="text-2xl md:text-3xl font-light tracking-wide mb-6">Quán Mới Cập Nhật</h2>
        </div>

        <!-- Màn hình tiêu điểm -->
        <div id="screen-highlight" class="screen-view hidden h-full w-full p-6 md:p-10 overflow-y-auto custom-scrollbar absolute inset-0 bg-[#030305] z-20 animate-fade-in">
            <h2 class="text-2xl md:text-3xl font-light tracking-wide mb-6">Tiêu Điểm Tuần</h2>
            <div class="h-64 liquid-glass-card rounded-3xl p-8 flex flex-col justify-center items-center text-center">
                <span class="text-4xl mb-3">🔥</span>
                <h3 class="text-xl font-medium text-yellow-300">Góc trà đá Phố Cổ huyền thoại</h3>
            </div>
        </div>
    </div>

    <!-- Modal Thêm Quán -->
    <div id="add-modal" class="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black/75 backdrop-blur-3xl modal-hidden">
        <div class="liquid-glass border border-white/30 p-6 md:p-8 w-full max-w-md relative rounded-3xl shadow-2xl">
            <button onclick="closeModal()" class="absolute top-5 right-5 text-gray-400 hover:text-white bg-white/10 w-8 h-8 rounded-full flex items-center justify-center transition">✕</button>

            <h2 class="text-xl font-light tracking-wider text-white mb-6 border-b border-white/15 pb-3">
                Thêm Quán Trà Đá Mới
            </h2>

            <form id="add-shop-form" class="space-y-4 text-sm font-light">
                <div class="border-2 border-dashed border-white/25 hover:border-yellow-400/60 p-4 text-center cursor-pointer transition relative rounded-2xl bg-black/40">
                    <input type="file" id="shop-image" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                    <div id="image-preview-container" class="flex flex-col items-center justify-center pointer-events-none">
                        <span class="text-2xl mb-1">📸</span>
                        <span class="text-gray-300 text-xs">Chạm để tải ảnh mặt tiền quán</span>
                    </div>
                </div>

                <div>
                    <input id="shop-name" required type="text" class="w-full px-4 py-2.5 rounded-xl bg-black/60 border border-white/20 focus:border-yellow-400 focus:outline-none transition text-white text-sm" placeholder="Tên quán">
                </div>
                <div>
                    <input id="shop-address" required type="text" class="w-full px-4 py-2.5 rounded-xl bg-black/60 border border-white/20 focus:border-yellow-400 focus:outline-none transition text-white text-sm" placeholder="Địa chỉ">
                </div>
                <div>
                    <input id="shop-price" required type="text" class="w-full px-4 py-2.5 rounded-xl bg-black/60 border border-white/20 focus:border-yellow-400 focus:outline-none transition text-white text-sm" placeholder="Mức giá (VD: 10K)">
                </div>

                <div class="pt-3">
                    <button type="submit" class="w-full liquid-glass-pill text-white font-semibold tracking-wide py-3 rounded-xl hover:bg-white/30 transition-all uppercase text-xs shadow-lg">
                        Xác nhận ghim lên bản đồ
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Xử Lý Logic & LocalStorage -->
    <script>
        let currentLatLng = { lat: 21.0285, lng: 105.8541 };
        let mapMarkersLayer = null;
        let uploadedImageBase64 = ''; 

        const defaultImage = "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?q=80&w=600&auto=format&fit=crop";

        let shops = JSON.parse(localStorage.getItem('trada_hanoi_shops_v10'));
        if (!shops || shops.length === 0) {
            shops = [
                { id: 1, name: "Trà Đá Nhà Thờ Lớn", address: "Hoàn Kiếm", lat: 21.0287, lng: 105.8488, price: "15K", image: "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=600" },
                { id: 2, name: "Trà Đá Hồ Tây", address: "Thanh Niên, Tây Hồ", lat: 21.0487, lng: 105.8388, price: "10K", image: "https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=600" },
                { id: 3, name: "Trà Đá Cầu Giấy", address: "Xuân Thủy, Cầu Giấy", lat: 21.0350, lng: 105.7950, price: "5K", image: "https://images.unsplash.com/photo-1525648199074-cee30ba79a4a?w=600" }
            ];
            localStorage.setItem('trada_hanoi_shops_v10', JSON.stringify(shops));
        }

        const map = L.map('map', { zoomControl: false }).setView([21.0285, 105.8541], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        mapMarkersLayer = L.layerGroup().addTo(map);

        const teaIcon = L.divIcon({
            html: `<div style="font-size: 26px; filter: drop-shadow(0 0 12px rgba(250, 204, 21, 0.9));">📍</div>`,
            className: 'bg-transparent border-none',
            iconSize: [26, 26],
            iconAnchor: [13, 13]
        });

        function renderApp() {
            const listContainer = document.getElementById('shop-list');
            listContainer.innerHTML = '';
            mapMarkersLayer.clearLayers();

            shops.forEach(shop => {
                const shopCard = document.createElement('div');
                shopCard.className = "liquid-glass-card rounded-xl overflow-hidden cursor-pointer flex gap-2.5 p-2 items-center group relative animate-fade-in flex-none";
                shopCard.innerHTML = `
                    <img src="${shop.image || defaultImage}" class="w-12 h-12 rounded-lg object-cover flex-none group-hover:scale-105 transition duration-300" alt="Shop">
                    <div class="flex-1 min-w-0">
                        <h3 class="text-xs font-medium text-white truncate group-hover:text-yellow-300 transition">${shop.name}</h3>
                        <p class="text-[11px] text-gray-400 truncate">${shop.address}</p>
                        <span class="inline-block mt-0.5 text-[10px] font-medium text-yellow-300 bg-yellow-500/10 px-2 py-0.5 rounded-full border border-yellow-500/20">${shop.price}</span>
                    </div>
                    <button onclick="deleteShop(${shop.id}, event)" class="absolute top-1.5 right-1.5 text-gray-500 hover:text-red-400 text-xs px-1.5 py-0.5 opacity-0 group-hover:opacity-100 transition-opacity">✕</button>
                `;
                shopCard.onclick = () => {
                    map.flyTo([shop.lat, shop.lng], 16, { duration: 1.2 });
                    if(window.innerWidth < 1024) {
                        document.getElementById('screen-map').scrollIntoView({behavior: 'smooth'});
                    }
                };
                listContainer.appendChild(shopCard);

                L.marker([shop.lat, shop.lng], { icon: teaIcon })
                    .bindPopup(`
                        <div class="font-sans font-light tracking-wide w-44 p-1">
                            <img src="${shop.image || defaultImage}" class="w-full h-24 object-cover mb-2 rounded-xl border border-white/20">
                            <span class="text-white font-medium">${shop.name}</span>
                            <p class="text-xs text-gray-300 mt-1">${shop.address}</p>
                            <span class="inline-block mt-2 text-xs text-yellow-300 font-semibold">${shop.price}</span>
                        </div>
                    `)
                    .addTo(mapMarkersLayer);
            });
        }

        function switchScreen(targetId) {
            const screenViews = document.querySelectorAll('.screen-view');
            const navItems = document.querySelectorAll('.nav-item');

            screenViews.forEach(screen => {
                screen.classList.add('hidden');
                screen.classList.remove('flex', 'block', 'z-10');
            });

            const targetScreen = document.getElementById(targetId);
            if (targetId === 'screen-map') {
                targetScreen.classList.remove('hidden');
                targetScreen.classList.add('flex', 'z-10');
                setTimeout(() => { map.invalidateSize(); }, 100);
            } else {
                targetScreen.classList.remove('hidden');
                targetScreen.classList.add('block', 'z-10');
            }

            navItems.forEach(nav => {
                if(nav.getAttribute('data-target') === targetId) {
                    nav.classList.add('active');
                } else {
                    nav.classList.remove('active');
                }
            });
        }

        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                switchScreen(this.getAttribute('data-target'));
            });
        });

        document.getElementById('shop-image').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    uploadedImageBase64 = event.target.result;
                    document.getElementById('image-preview-container').innerHTML = `<img src="${uploadedImageBase64}" class="w-full h-28 object-cover rounded-xl border border-white/20 animate-fade-in">`;
                };
                reader.readAsDataURL(file); 
            }
        });

        const modal = document.getElementById('add-modal');
        const form = document.getElementById('add-shop-form');

        map.on('click', function(e) {
            currentLatLng = e.latlng;
            openModal();
        });

        function openModalQuick() {
            currentLatLng = map.getCenter();
            openModal();
        }

        function openModal() {
            modal.classList.remove('modal-hidden');
            modal.classList.add('modal-visible');
            document.getElementById('shop-name').focus();
            uploadedImageBase64 = '';
            document.getElementById('image-preview-container').innerHTML = `
                <span class="text-2xl mb-1">📸</span>
                <span class="text-gray-300 text-xs">Chạm để tải ảnh mặt tiền quán</span>
            `;
        }

        function closeModal() {
            modal.classList.remove('modal-visible');
            modal.classList.add('modal-hidden');
            form.reset();
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const newShop = {
                id: Date.now(),
                name: document.getElementById('shop-name').value,
                address: document.getElementById('shop-address').value,
                price: document.getElementById('shop-price').value,
                lat: currentLatLng.lat,
                lng: currentLatLng.lng,
                image: uploadedImageBase64 || defaultImage
            };

            shops.unshift(newShop);
            try {
                localStorage.setItem('trada_hanoi_shops_v10', JSON.stringify(shops));
            } catch (err) {
                alert("Dung lượng ảnh quá lớn!");
                shops.shift(); 
                return;
            }
            
            closeModal();
            renderApp();
            switchScreen('screen-map');
            map.flyTo([newShop.lat, newShop.lng], 16, { duration: 1.5 });
        });

        window.deleteShop = function(id, event) {
            event.stopPropagation();
            if(confirm("Xóa quán này khỏi bản đồ?")) {
                shops = shops.filter(s => s.id !== id);
                localStorage.setItem('trada_hanoi_shops_v10', JSON.stringify(shops));
                renderApp();
            }
        }

        renderApp();
    </script>
</body>
</html>
